name: Update Free Configs

on:
  schedule:
    # Every 15 minutes (GitHub may delay cron slightly on free plans)
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "sources.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

# Queue runs instead of cancelling mid-push (avoids race rejects)
concurrency:
  group: update-configs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needed so the bot can push back to main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggregate public configs
        run: python3 scripts/update_configs.py

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name "mk-studio-bot"
          git config user.email "mk-studio-bot@users.noreply.github.com"

          git add \
            all_configs.txt \
            all_extracted_configs.txt \
            MK-Studio-VPN-All-Type.txt \
            MK-Studio-VPN.txt \
            vmess_configs.txt \
            vless_configs.txt \
            trojan_configs.txt \
            ss_configs.txt \
            ssr_configs.txt \
            hysteria2_configs.txt \
            tuic_configs.txt \
            subscription.txt \
            subscription-lite.txt \
            subscription-vless.txt \
            subscription-vmess.txt \
            subscription-trojan.txt \
            subscription-ss.txt \
            meta.json \
            countries \
            mixed-protocol-chunks \
            separated-protocols-chunks

          # Pick up removed/renamed country & chunk files too
          git add -A countries mixed-protocol-chunks separated-protocols-chunks

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: refresh free public configs"

          # Retry push with rebase if another run updated main first
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded (attempt $i)"
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 2))
          done

          echo "Push failed after retries"
          exit 1
